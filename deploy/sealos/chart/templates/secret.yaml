{{- /*
The dashboard password: either the operator supplies one, reuses an existing Secret, or Helm
generates it once and keeps it for the life of the release (lookup keeps upgrades from rotating
it, which would log everyone out and break running channel bindings).
*/ -}}
{{- $secretName := default (printf "%s-env" .Release.Name) .Values.existingSecret -}}
{{- if not .Values.existingSecret -}}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $secretName -}}
{{- $token := "" -}}
{{- if .Values.adminToken -}}
{{- $token = .Values.adminToken -}}
{{- else if and $existing $existing.data -}}
{{- $token = index $existing.data "ADMIN_TOKEN" | b64dec -}}
{{- else -}}
{{- $token = randAlphaNum 48 -}}
{{- end -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName }}
  labels:
    app.kubernetes.io/name: {{ .Chart.Name }}
    app.kubernetes.io/instance: {{ .Release.Name }}
type: Opaque
stringData:
  ADMIN_TOKEN: {{ $token | quote }}
  PUBLIC_URL: {{ required "set publicUrl to the address people reach this install on, e.g. https://mochi.example.com" .Values.publicUrl | quote }}
  DATA_DIR: /app/data
  PORT: {{ .Values.service.port | quote }}
  TRUST_PROXY: {{ .Values.trustProxy | quote }}
{{- range $k, $v := .Values.extraEnv }}
  {{ $k }}: {{ $v | quote }}
{{- end }}
{{- end }}
