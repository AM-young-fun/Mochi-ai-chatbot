# Mochi on Sealos (Kubernetes manifests).
#
# Two ways to use this file:
#
#   1. Sealos Desktop → 应用管理 (App Launchpad), fill the form instead of applying YAML:
#        image:      ghcr.io/OWNER/mochi:latest
#        port:       3000  → 外网访问 on
#        env:        PUBLIC_URL / DATA_DIR=/app/data / PORT=3000 / TRUST_PROXY=1
#                    (no ADMIN_TOKEN: the dashboard asks for a password on first visit, with the
#                     one-time setup code from the app's logs; the hash is kept in /app/data)
#        storage:    PVC 1Gi mounted at /app/data
#
#   2. kubectl apply -f deploy/sealos/mochi.yaml   (edit the marked values first; it goes into your
#      current namespace, which on Sealos is your own ns-xxxx)
#
# Values marked CHANGE-ME must be replaced. Single replica on purpose: SQLite (WAL) does not
# support concurrent writers, and a Telegram bot token may only be polled by one instance.
# The image is published by .github/workflows/docker.yml to GHCR as
#   ghcr.io/am-young-fun/mochi:latest   (+ :sha-<short>, and semver tags for v* releases)
#
# GHCR packages start PRIVATE. Either make it public once
#   https://github.com/orgs/flatkey-ai/packages/container/mochi/settings  → Change visibility
# or create a pull secret and reference it from the Deployment (both shown below).
#
#   kubectl create secret docker-registry ghcr-pull \
#     --docker-server=ghcr.io --docker-username=<your-github-user> \
#     --docker-password=<PAT with read:packages>
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mochi-data
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: Secret
metadata:
  name: mochi-env
type: Opaque
stringData:
  # Leave empty: on first visit the dashboard asks you to choose a password (it needs the one-time
  # setup code printed in the pod log) and stores only its hash in /app/data/admin-password.
  ADMIN_TOKEN: ""
  # CHANGE-ME: the public https URL Sealos gives the app; widgets, install links and the
  # LINE webhook hint are all built from it.
  PUBLIC_URL: "https://mochi.example.com"
  DATA_DIR: "/app/data"
  PORT: "3000"
  # Behind the Sealos ingress: trust one proxy hop so rate limits see each visitor's real IP.
  TRUST_PROXY: "1"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mochi
  labels: { app: mochi }
spec:
  replicas: 1
  strategy:
    # Recreate, not RollingUpdate: two instances would fight over the channel connections
    # (Telegram polling, QQ/Slack gateways) and over the SQLite file.
    type: Recreate
  selector:
    matchLabels: { app: mochi }
  template:
    metadata:
      labels: { app: mochi }
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      containers:
        - name: mochi
          # CHANGE-ME: your image, e.g. ghcr.io/OWNER/mochi:latest
          image: ghcr.io/am-young-fun/mochi:latest
          imagePullPolicy: IfNotPresent
          # Uncomment if the GHCR package stays private:
          # imagePullSecrets:
          #   - name: ghcr-pull
          ports:
            - { name: http, containerPort: 3000 }
          envFrom:
            - secretRef: { name: mochi-env }
          volumeMounts:
            - { name: data, mountPath: /app/data }
          readinessProbe:
            httpGet: { path: /health, port: http }
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /health, port: http }
            initialDelaySeconds: 30
            periodSeconds: 30
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { memory: 1Gi }
      volumes:
        - name: data
          persistentVolumeClaim: { claimName: mochi-data }
---
apiVersion: v1
kind: Service
metadata:
  name: mochi
spec:
  selector: { app: mochi }
  ports:
    - { name: http, port: 3000, targetPort: http }
---
# Sealos issues certificates through cert-manager. Adjust the ingress class / issuer to match
# your cluster if it differs (Sealos Desktop default: nginx + letsencrypt-prod).
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: mochi
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/proxy-body-size: "26m"
    # LINE and the other platforms call in over HTTPS; force it.
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
spec:
  ingressClassName: nginx
  tls:
    - hosts: ["mochi.example.com"]          # CHANGE-ME
      secretName: mochi-tls
  rules:
    - host: mochi.example.com                # CHANGE-ME
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: mochi
                port: { name: http }
