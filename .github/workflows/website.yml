name: Website

# Deploys website/ (Next.js) to Vercel with the Vercel CLI.
#   push to main   → production
#   pull request   → preview (URL posted in the job summary)
# Needs: secret VERCEL_TOKEN; variables (or secrets) VERCEL_ORG_ID and VERCEL_PROJECT_ID.
# Works whether the Vercel project's Root Directory is "website" or empty.

on:
  push:
    branches: [main]
    paths: ["website/**", ".github/workflows/website.yml"]
  pull_request:
    paths: ["website/**", ".github/workflows/website.yml"]
  workflow_dispatch:

concurrency:
  group: website-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Fork PRs don't get secrets; skip instead of failing.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    defaults:
      run:
        working-directory: website
    env:
      VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID || secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID || secrets.VERCEL_PROJECT_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      TARGET: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && 'production' || 'preview' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: website/package-lock.json
      - name: Check Vercel settings
        run: |
          missing=""
          [ -n "$VERCEL_TOKEN" ] || missing="$missing VERCEL_TOKEN"
          [ -n "$VERCEL_ORG_ID" ] || missing="$missing VERCEL_ORG_ID"
          [ -n "$VERCEL_PROJECT_ID" ] || missing="$missing VERCEL_PROJECT_ID"
          if [ -n "$missing" ]; then echo "::error::Missing in repo Settings → Secrets and variables → Actions:$missing"; exit 1; fi
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm i -g vercel@latest
      - name: Pull Vercel project settings and env
        working-directory: .
        run: |
          vercel pull --yes --environment=$TARGET --token=$VERCEL_TOKEN
          # Vercel resolves Root Directory relative to where it runs. With "website" set, run from
          # the repo root; with it empty, run from website/.
          root=$(node -p "require('./.vercel/project.json').settings?.rootDirectory || ''")
          if [ -z "$root" ]; then mv .vercel website/; echo "VERCEL_CWD=website" >> "$GITHUB_ENV"; else echo "VERCEL_CWD=." >> "$GITHUB_ENV"; fi
          echo "Vercel Root Directory: '${root}'"
      - name: Build
        working-directory: .
        run: cd "$VERCEL_CWD" && vercel build $([ "$TARGET" = production ] && echo --prod) --token=$VERCEL_TOKEN
      - name: Deploy
        id: deploy
        working-directory: .
        run: |
          cd "$VERCEL_CWD"
          url=$(vercel deploy --prebuilt $([ "$TARGET" = production ] && echo --prod) --token=$VERCEL_TOKEN)
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "### Website $TARGET deploy: $url" >> "$GITHUB_STEP_SUMMARY"
