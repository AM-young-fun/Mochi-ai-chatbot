# Render Blueprint: the "Deploy to Render" button creates this service.
# It runs the published image (ghcr.io/am-young-fun/mochi:latest), so there is nothing to build:
# to update later, open the service in Render and click Manual Deploy → Deploy latest reference.
# One instance with a 1 GB persistent disk for bots, memory and knowledge. Render disks need a paid
# instance type; Starter is the smallest. (Prefer a database? Remove the disk and set DATABASE_URL to
# a PostgreSQL address.) The public URL comes from RENDER_EXTERNAL_URL automatically.
services:
  - type: web
    name: mochi
    runtime: image
    image:
      url: ghcr.io/am-young-fun/mochi:latest
    plan: starter
    healthCheckPath: /health
    disk:
      name: mochi-data
      mountPath: /app/data
      sizeGB: 1
    envVars:
      # Render asks for this while creating the service. Get one at flatkey.ai (new accounts get $1
      # free credit). Leave it empty to add the key in the dashboard later instead.
      - key: FLATKEY_API_KEY
        sync: false
      - key: DATA_DIR
        value: /app/data
      - key: TRUST_PROXY
        value: "1"
